name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Raspberry Pi OS Bookworm ships Python 3.11.
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            hudiy_dataview/package-lock.json
            help-site/package-lock.json
      - name: Dataview install
        working-directory: hudiy_dataview
        run: npm ci
      - name: Dataview typecheck
        working-directory: hudiy_dataview
        run: npm run typecheck
      - name: Dataview tests
        working-directory: hudiy_dataview
        run: node --test tests/*.test.cjs tests/*.test.mjs
      - name: Help site tests
        working-directory: help-site
        run: npm ci && npm run check
      - name: Tool and emulator tests
        run: node --test tests/*.js tools/test_audscii_helper.cjs
